<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ertele</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="reel.css">
</head>
<body>
<script src="engine.js"></script>
<script>
/* REEL 18 — "ERTELE"
   Yatak odası. Alarm çalar, el uzanır, ERTELE. Tekrar. Tekrar. Döngü hızlanır;
   pencereden gece-gündüz akar, sayaç ×847'ye çıkar. Son alarmda adam yorganı atar,
   kalkar, kapıyı açar. Giriş yok: ilk karede alarm çalıyor. */
(function () {
  const { lerp, clamp, E, prog } = F;
  const FL = 1380, BED_Y = 1288, TF = 10.8;
  const S = [];
  for (let t = 0.05, k = 0; t < TF - 0.1; k++) { S.push(t); t += Math.max(0.15, 1.3 * Math.pow(0.84, k)); }
  const K = S.length;
  const countAt = (k) => k <= 0 ? 0 : Math.max(k, Math.round(847 * Math.pow(k / K, 1.8)));
  const cycle = (t) => { let k = -1; for (let i = 0; i < K; i++) if (t >= S[i]) k = i; return k; };

  function clockFace(ctx, x, y, txt, ring, t) {
    const sh = ring ? Math.sin(t * 90) * 5 : 0;
    ctx.save(); ctx.translate(x + sh, y);
    ctx.fillStyle = '#121318'; ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 3;
    F.rrect(ctx, -58, -34, 116, 68, 14); ctx.fill(); ctx.stroke();
    ctx.restore();
    F.text(ctx, txt, x + sh, y + 2, { size: 34, weight: 700, font: F.CONFIG.mono, color: F.CONFIG.red, glow: ring ? 20 : 8 });
    if (ring) for (let i = 0; i < 3; i++) {
      const q = ((t * 3 + i / 3) % 1);
      ctx.strokeStyle = F.hexA(F.CONFIG.red, 0.7 * (1 - q)); ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x, y, 70 + q * 90, -Math.PI * 0.85, -Math.PI * 0.15); ctx.stroke();
    }
  }

  Reel({
    title: 'Ertele',
    duration: 20,
    cues() {
      const c = [{ t: 0, type: 'hit' }];
      S.forEach((s, k) => { const d = (k + 1 < K ? S[k + 1] : TF) - s; c.push({ t: s, type: 'lowbat' }); c.push({ t: s + Math.min(0.45, d * 0.55), type: 'block', p: 0.1 }); });
      for (let i = 0; i < 5; i++) c.push({ t: TF + i * 0.33, type: 'lowbat' });
      c.push({ t: 11.4, type: 'whoosh' }, { t: 11.9, type: 'step', p: 0.3 }, { t: 12.2, type: 'step', p: 0.4 }, { t: 12.5, type: 'step', p: 0.5 },
        { t: 12.2, type: 'door' }, { t: 12.7, type: 'climax' }, { t: 4.0, type: 'whoosh' }, { t: 7.5, type: 'whoosh' },
        { t: 13.0, type: 'drop' }, { t: 13.3, type: 'punch' }, { t: 14.5, type: 'hit' }, { t: 17.3, type: 'end' });
      return { music: { bpm: 124, grid0: 0.0, climax: TF, punch: 13.3, end: 17.3, prog: 'am', drums: 'full' }, cues: c };
    },
    draw(ctx, t, F) {
      const { W, H, CONFIG: C } = F;
      const k = cycle(t), cnt = countAt(k + 1);
      const next = k + 1 < K ? S[k + 1] : TF, dur = next - (S[k] ?? 0), u = k >= 0 ? (t - S[k]) / dur : 0;
      const final = t >= TF;
      const ring = final ? t < 11.3 : u < 0.55;
      const hitK = final ? 0 : clamp((u - 0.2) / 0.3);         // el uzanır ve basar
      const day = Math.floor(cnt / 2.7) + 1;
      const up = E.inOutCubic(prog(t, 11.3, 11.8));
      const sun = prog(t, 11.3, 12.8);

      // gökyüzü rengi: her döngüde gece ↔ sabah
      const dayPh = final ? 1 : 0.5 + 0.5 * Math.sin(k * 1.9);
      const sky = F.mixHex(F.mixHex('#0b1430', '#5a3a68', dayPh), '#f4b740', sun * 0.8);
      F.background(ctx, t, { color: '#08090c', tint: F.hexA(C.gold, 0.12 * sun), tintY: 700 });

      // ---- HUD ----
      F.text(ctx, 'ERTELE', W / 2, 250, { size: 26, weight: 800, color: C.dim, ls: 8 });
      F.text(ctx, '×' + cnt, W / 2, 330, { size: 96, weight: 700, font: C.mono, color: final ? C.gold : C.red, glow: 24 });
      F.text(ctx, 'GÜN ' + day, W / 2, 402, { size: 26, weight: 700, font: C.mono, color: C.dim, ls: 3 });
      // geri sar işareti (döngü hissi)
      if (!final && u < 0.25 && k > 0) F.text(ctx, '◀◀ TEKRAR', 112, 250, { size: 20, weight: 800, font: C.mono, align: 'left', color: C.dim, alpha: 1 - u / 0.25, ls: 2 });

      // ---- oda ----
      ctx.fillStyle = '#0d0e12'; ctx.fillRect(0, FL, W, H - FL);
      ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, FL); ctx.lineTo(W, FL); ctx.stroke();
      // pencere
      {
        const wx = 600, wy = 560, ww = 300, wh = 300;
        const g = ctx.createLinearGradient(0, wy, 0, wy + wh);
        g.addColorStop(0, sky); g.addColorStop(1, F.mixHex(sky, '#000000', 0.5));
        ctx.fillStyle = g; ctx.fillRect(wx, wy, ww, wh);
        if (dayPh < 0.5 && !final) for (let i = 0; i < 12; i++) { ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(wx + ((i * 71) % ww), wy + ((i * 43) % (wh * 0.6)), 2, 2); }
        if (sun > 0) F.glowCircle(ctx, wx + ww / 2, wy + wh - 40 * sun, 260, C.gold, sun);
        ctx.strokeStyle = '#1e2026'; ctx.lineWidth = 10; ctx.strokeRect(wx, wy, ww, wh);
        ctx.beginPath(); ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh); ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2); ctx.stroke();
        if (sun > 0) { // ışık huzmesi
          ctx.save(); ctx.globalAlpha = 0.25 * sun; ctx.fillStyle = C.gold;
          ctx.beginPath(); ctx.moveTo(wx, wy + wh); ctx.lineTo(wx + ww, wy + wh); ctx.lineTo(wx + ww - 80, FL); ctx.lineTo(wx - 260, FL); ctx.closePath(); ctx.fill(); ctx.restore();
        }
      }
      // kapı
      const doorO = E.inOutCubic(prog(t, 12.2, 12.8));
      ctx.save();
      if (doorO > 0) { ctx.fillStyle = F.hexA(C.gold, 0.9); ctx.shadowColor = C.gold; ctx.shadowBlur = 60; ctx.fillRect(930, 1070, 110, FL - 1070); }
      ctx.shadowBlur = 0; ctx.fillStyle = '#16181d'; ctx.fillRect(930, 1070, 110 * (1 - doorO), FL - 1070);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 3; ctx.strokeRect(930, 1070, 110, FL - 1070);
      ctx.restore();
      // komodin + saat
      ctx.fillStyle = '#15171c'; ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 3;
      F.rrect(ctx, 50, 1250, 120, FL - 1250, 8); ctx.fill(); ctx.stroke();
      const mins = final ? 0 : ((k % 3) + (u > 0.5 ? 1 : 0)) * 9;
      clockFace(ctx, 110, 1210, '07:' + String(mins).padStart(2, '0'), ring, t);
      // yatak
      ctx.fillStyle = '#1a1c22'; ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 3; F.rrect(ctx, 190, BED_Y, 470, 60, 12); ctx.fill(); ctx.stroke();
      F.rrect(ctx, 190, BED_Y - 40, 90, 40, 12); ctx.fill(); ctx.stroke();
      ctx.fillRect(200, BED_Y + 60, 14, FL - BED_Y - 60); ctx.fillRect(636, BED_Y + 60, 14, FL - BED_Y - 60);

      // ---- adam ----
      if (up < 0.5) {
        // yatarken: ayakta pozu -90° döndür (baş solda yastıkta)
        const reach = Math.sin(Math.PI * hitK);
        const pose = { ...F.P.stand(0), head: 0.1, shR: lerp(0.15, 2.75, reach), elR: lerp(0.1, 0.25, reach), shL: 0.1, elL: 0.1 };
        ctx.save(); ctx.globalAlpha = 1 - up * 2; ctx.translate(540, BED_Y - 16); ctx.rotate(-Math.PI / 2);
        F.stickman(ctx, { x: 0, y: 0, s: 1.3, pose, color: '#cfcac3', glow: 0 });
        ctx.restore();
        // yorgan
        ctx.save(); ctx.globalAlpha = 1 - up * 2; ctx.fillStyle = '#2a3042'; ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        F.rrect(ctx, 410, BED_Y - 50, 240, 54, 18); ctx.fill(); ctx.stroke(); ctx.restore();
      }
      if (up > 0) {
        const walk = E.inOutQuad(prog(t, 11.8, 12.8));
        const x = lerp(470, 960, walk);
        let pose = F.mixPose({ lean: 0.3, hipL: 1.5, kneeL: 1.45, hipR: 1.4, kneeR: 1.4, shL: 0.2, elL: 0.3, shR: 0.3, elR: 0.3, head: 0.25 }, F.P.stand(t), prog(t, 11.5, 11.8));
        let y = lerp(BED_Y, FL, prog(t, 11.5, 11.8)), sit = t < 11.65;
        if (t > 11.8) pose = F.P.walk(t * 9, 1);
        if (t > 12.8) pose = F.P.celebrate(t);
        F.stickman(ctx, { x, y, s: 1.15, dir: 1, pose: { ...pose, sit }, alpha: clamp(up * 2), glow: 30 * sun, glowColor: C.gold, color: F.mixHex('#cfcac3', '#f4f2ee', sun) });
        if (sun > 0.5) F.embers(ctx, t, { x, y: FL - 120, w: 70, h: 200, n: 20, color: C.gold, seed: 2 });
      }

      // ---- minimal yazılar ----
      const cap = (str, a, b, col) => { const kk = prog(t, a, a + 0.4) * (1 - prog(t, b - 0.4, b)); if (kk > 0) F.revealLine(ctx, str, W / 2, 1530, prog(t, a, a + 0.6), { size: 38, weight: 800, alpha: kk, accent: col }); };
      cap('HER SABAH *AYNI KAVGA.*', 3.6, 7.2, C.red);
      cap('VE HER SABAH *KAYBEDİYORSUN.*', 7.4, 10.8, C.red);
      cap('TA Kİ BİR GÜN *KALKANA* KADAR.', 11.0, 12.9, C.gold);

      // ---- final ----
      if (t > 13.0) {
        const kk = E.outCubic(prog(t, 13.0, 13.7));
        ctx.save(); ctx.fillStyle = `rgba(5,6,8,${0.84 * kk})`; ctx.fillRect(0, 0, W, H); ctx.restore();
        F.revealLine(ctx, 'ERTELE TUŞU', W / 2, 870, prog(t, 13.3, 13.9), { size: 104, weight: 900 });
        F.revealLine(ctx, '*HAYATINI ERTELİYOR.*', W / 2, 1020, prog(t, 14.5, 15.1), { size: 92, weight: 900, accent: C.red, hiGlow: 46, stagger: 0.3 });
      }
      F.handleTag(ctx, 1 - prog(t, 16.7, 17.1));
      F.endCard(ctx, t, 17.3, 'SABAHLARI KAÇ KEZ ERTELİYORSUN?');
    },
  });
})();
</script>
</body>
</html>
