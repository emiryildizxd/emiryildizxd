<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Şarj</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="reel.css">
</head>
<body>
<script src="engine.js"></script>
<script>
/* REEL 05 — "ŞARJ"
   Gece. Adamın kafasından dev telefona bir kablo uzanır. Telefon şarj oldukça
   adamın enerjisi kablodan akıp gider. 23:47 → 04:12.  TELEFON %100. SEN %3.
   Giriş yok: ilk karede enerji zaten akıyor. */
(function () {
  const { lerp, clamp, E, rng } = F;
  const TC = 13.0;                                   // şarj tamam
  const ground = 1450, PX = 640, PY = 860, PW = 270, PH = 560;   // telefon
  const port = [PX + PW / 2, PY + PH];
  const charge = (t) => E.inOutQuad(clamp(t / TC)) * 0.85 + clamp(t / TC) * 0.15;
  const youPct = (t) => Math.round(100 - 97 * charge(t)), phonePct = (t) => Math.round(3 + 97 * charge(t));

  // akış kartları (telefon ekranında kayan içerik)
  const r = rng(31);
  const cards = Array.from({ length: 14 }, () => ({ h: 90 + r() * 140, c: ['#ff3fa4', '#3d8bff', '#3ee08f', '#ff8a3d', '#9b7bff', '#f4b740'][Math.floor(r() * 6)], lines: 1 + Math.floor(r() * 3) }));
  const feedH = cards.reduce((s, c) => s + c.h + 18, 0);

  function bez(p0, p1, p2, p3, u) {
    const a = 1 - u;
    return [a * a * a * p0[0] + 3 * a * a * u * p1[0] + 3 * a * u * u * p2[0] + u * u * u * p3[0],
      a * a * a * p0[1] + 3 * a * a * u * p1[1] + 3 * a * u * u * p2[1] + u * u * u * p3[1]];
  }
  function battery(ctx, x, y, pct, col, blink) {
    const w = 150, h = 62;
    ctx.save();
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    F.rrect(ctx, x, y, w, h, 12); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; F.rrect(ctx, x + w + 4, y + h / 2 - 12, 10, 24, 4); ctx.fill();
    const fw = Math.max(6, (w - 14) * pct / 100);
    ctx.globalAlpha *= blink; ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 20;
    F.rrect(ctx, x + 7, y + 7, fw, h - 14, 7); ctx.fill();
    ctx.restore();
  }

  Reel({
    title: 'Şarj',
    duration: 21,
    cues() {
      const c = [{ t: 0, type: 'hit' }];
      for (let t = 0.2; t < TC; t += 0.6) c.push({ t, type: 'pulse', p: t / TC });
      for (let t = 0.3; t < TC + 0.5; t += 0.45) c.push({ t, type: 'swipe' });
      for (let t = 0; t < TC + 0.8; t += 1 / 60) if (youPct(t) <= 15 && Math.round(t * 60) % 48 === 0) c.push({ t, type: 'lowbat' });
      c.push({ t: 3.0, type: 'whoosh' }, { t: 7.5, type: 'whoosh' }, { t: 8.0, type: 'riser', d: TC - 8.0 },
        { t: TC, type: 'ding' }, { t: TC, type: 'climax' },
        { t: 13.9, type: 'drop' }, { t: 14.2, type: 'punch' }, { t: 15.4, type: 'hit' }, { t: 18.0, type: 'end' });
      return { music: { bpm: 128, grid0: 0.0, climax: TC, punch: 14.2, end: 18.0, prog: 'em', drums: 'full' }, cues: c };
    },
    draw(ctx, t, F) {
      const { W, H, CONFIG: C, prog } = F;
      const d = charge(t);                                          // 0 → 1 tükeniş
      const you = youPct(t), ph = phonePct(t);
      const full = t >= TC;
      F.background(ctx, t, { tint: F.hexA('#3d8bff', 0.04 + 0.1 * d), tintY: PY + PH / 2 });

      // ---- saat (ilk karede var, animasyonla gelmez) ----
      const mins = (23 * 60 + 47 + Math.floor(clamp(t / TC) * 265)) % 1440;
      const clock = String(Math.floor(mins / 60)).padStart(2, '0') + (Math.floor(t * 2) % 2 ? ' ' : ':') + String(mins % 60).padStart(2, '0');
      F.text(ctx, clock, W / 2, 300, { size: 110, weight: 700, font: C.mono, color: C.ink, glow: 20, glowColor: '#3d8bff', ls: 4 });

      // ---- pil HUD ----
      const lowBlink = you <= 15 ? (Math.floor(t * 3) % 2 ? 0.35 : 1) : 1;
      const youCol = F.mixHex('#f4b740', '#ff4d5e', clamp((60 - you) / 45));
      const phCol = F.mixHex('#3d8bff', '#3ee08f', clamp((ph - 40) / 60));
      F.panel(ctx, 80, 420, 440, 170);
      F.panel(ctx, 560, 420, 440, 170, full ? { stroke: F.hexA('#3ee08f', 0.6), fill: F.hexA('#3ee08f', 0.06) } : {});
      F.text(ctx, 'SEN', 112, 458, { size: 24, weight: 800, align: 'left', color: youCol, ls: 4 });
      F.text(ctx, 'TELEFON', 592, 458, { size: 24, weight: 800, align: 'left', color: phCol, ls: 4 });
      battery(ctx, 112, 498, you, youCol, lowBlink);
      battery(ctx, 592, 498, ph, phCol, 1);
      F.text(ctx, '%' + you, 488, 530, { size: 46, weight: 700, font: C.mono, align: 'right', color: you <= 15 ? C.red : C.ink, alpha: you <= 15 ? lowBlink : 1 });
      F.text(ctx, '%' + ph, 968, 530, { size: 46, weight: 700, font: C.mono, align: 'right', color: full ? '#3ee08f' : C.ink, glow: full ? 20 : 0 });

      // ---- zemin ----
      ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(60, ground); ctx.lineTo(W - 60, ground); ctx.stroke();

      // ---- dev telefon ----
      {
        const glowA = 0.25 + 0.75 * d + (full ? 0.3 * Math.max(0, 1 - (t - TC) / 0.8) : 0);
        F.glowCircle(ctx, PX + PW / 2, PY + PH / 2, 520, full ? '#3ee08f' : '#3d8bff', glowA);
        ctx.save();
        F.rrect(ctx, PX, PY, PW, PH, 36); ctx.fillStyle = '#111317'; ctx.fill();
        ctx.lineWidth = 6; ctx.strokeStyle = '#2b2e36'; ctx.stroke();
        // ekran
        const sx = PX + 16, sy = PY + 40, sw = PW - 32, sh = PH - 80;
        F.rrect(ctx, sx, sy, sw, sh, 18); ctx.save(); ctx.clip();
        ctx.fillStyle = '#05060a'; ctx.fillRect(sx, sy, sw, sh);
        const speed = lerp(120, 520, d);                        // kaydırma hızlanır
        const off = (t * speed) % feedH;
        let y = sy + 14 - off;
        for (let rep = 0; rep < 3; rep++) for (const c of cards) {
          if (y > sy + sh) break;
          if (y + c.h > sy) {
            ctx.fillStyle = F.hexA(c.c, 0.55 + 0.35 * d); F.rrect(ctx, sx + 12, y, sw - 24, c.h, 12); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            for (let l = 0; l < c.lines; l++) { F.rrect(ctx, sx + 26, y + 18 + l * 22, (sw - 70) * (l === c.lines - 1 ? 0.55 : 0.9), 10, 5); ctx.fill(); }
            ctx.beginPath(); ctx.arc(sx + sw - 40, y + c.h - 26, 10, 0, Math.PI * 2); ctx.fill();
          }
          y += c.h + 18;
        }
        // şarj bitti: yeşil şimşek
        if (full) {
          const k = E.outBack(clamp((t - TC) / 0.4));
          ctx.fillStyle = 'rgba(5,6,10,0.6)'; ctx.fillRect(sx, sy, sw, sh);
          ctx.save(); ctx.translate(sx + sw / 2, sy + sh / 2); ctx.scale(k, k);
          ctx.fillStyle = '#3ee08f'; ctx.shadowColor = '#3ee08f'; ctx.shadowBlur = 40;
          ctx.beginPath(); ctx.moveTo(14, -90); ctx.lineTo(-46, 12); ctx.lineTo(-4, 12); ctx.lineTo(-18, 90); ctx.lineTo(46, -14); ctx.lineTo(4, -14); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
        ctx.restore();
        // çentik + port
        ctx.fillStyle = '#05060a'; F.rrect(ctx, PX + PW / 2 - 45, PY + 14, 90, 14, 7); ctx.fill();
        ctx.fillStyle = '#2b2e36'; F.rrect(ctx, port[0] - 22, port[1] - 8, 44, 10, 4); ctx.fill();
        ctx.restore();
      }

      // ---- adam: ayakta bakıyor → çöküyor → yere oturuyor ----
      const manX = 300;
      const sitPose = { lean: 0.62, hipL: 2.15, kneeL: 1.95, hipR: 2.0, kneeR: 1.85, shL: 0.55, elL: 0.5, shR: 0.4, elR: 0.6, head: 0.7 };
      let pose = { ...F.P.stand(t), head: 0.35, lean: 0.06 };
      pose = F.mixPose(pose, F.P.slump(t), E.inOutQuad(prog(d, 0.25, 0.6)));
      pose = F.mixPose(pose, sitPose, E.inOutCubic(prog(d, 0.62, 0.85)));
      const youColBody = F.mixHex('#f4f2ee', '#58544f', E.inQuad(d));
      if (d < 0.5) F.embers(ctx, t, { x: manX, y: ground - 120, w: 70, h: 160, n: Math.floor(lerp(22, 0, d * 2)), color: C.gold, seed: 5 });
      const res = F.stickman(ctx, { x: manX, y: ground, s: 1.3, dir: 1, pose, color: youColBody, glow: lerp(30, 0, d), glowColor: C.gold });
      // düşük pil ünlemi
      if (you <= 15) {
        const hx = res.head[0], hy = res.head[1] - 70;
        F.text(ctx, '!', hx, hy, { size: 54, weight: 900, color: C.red, alpha: lowBlink, glow: 20 });
      }

      // ---- kablo: kafadan telefona ----
      {
        const p0 = [res.head[0] - 16, res.head[1] + 8];
        const p1 = [p0[0] - 230, p0[1] - 40], p2 = [p0[0] - 160, ground + 60], p3 = [port[0], port[1] + 2];
        ctx.save(); ctx.lineCap = 'round';
        ctx.strokeStyle = '#1c1e24'; ctx.lineWidth = 12;
        ctx.beginPath(); ctx.moveTo(...p0); ctx.bezierCurveTo(...p1, ...p2, ...p3); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 3; ctx.stroke();
        // enerji darbeleri adamdan telefona akar
        if (!full) {
          const n = 9, sp = lerp(0.35, 0.9, d);
          for (let i = 0; i < n; i++) {
            const u = ((t * sp + i / n) % 1);
            const [x, y] = bez(p0, p1, p2, p3, u);
            const col = F.mixHex('#f4b740', '#3ee08f', u);
            ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 18;
            ctx.beginPath(); ctx.arc(x, y, lerp(9, 6, u), 0, Math.PI * 2); ctx.fill();
          }
        }
        ctx.restore();
        // fiş başı
        ctx.fillStyle = '#2b2e36'; F.rrect(ctx, p0[0] - 10, p0[1] - 8, 20, 22, 5); ctx.fill();
      }

      // ---- ara yazılar (3. saniyeden sonra) ----
      const cap = (str, a, b, col) => { const k = prog(t, a, a + 0.4) * (1 - prog(t, b - 0.4, b)); if (k > 0) F.revealLine(ctx, str, W / 2, 1540, prog(t, a, a + 0.6), { size: 36, weight: 800, alpha: k, accent: col }); };
      cap('HER KAYDIRMA *SENDEN* ALIYOR.', 3.0, 6.8, C.red);
      cap('SAAT 03:00. *"5 DAKİKA"* DEMİŞTİN.', 7.5, 12.6, C.red);

      // ---- final ----
      if (t > 13.9) {
        const k = E.outCubic(prog(t, 13.9, 14.6));
        ctx.save(); ctx.fillStyle = `rgba(5,6,8,${0.84 * k})`; ctx.fillRect(0, 0, W, H); ctx.restore();
        F.revealLine(ctx, 'TELEFONUN *%100.*', W / 2, 880, prog(t, 14.2, 14.9), { size: 86, weight: 900, accent: '#3ee08f', hiGlow: 30 });
        F.revealLine(ctx, '*SEN %3.*', W / 2, 1040, prog(t, 15.4, 16.0), { size: 150, weight: 900, accent: C.red, hiGlow: 46, stagger: 0.2 });
      }
      F.handleTag(ctx, 1 - prog(t, 17.4, 17.8));
      F.endCard(ctx, t, 18.0);
    },
  });
})();
</script>
</body>
</html>
