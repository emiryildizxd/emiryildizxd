<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nabız</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="reel.css">
</head>
<body>
<script src="engine.js"></script>
<script>
/* REEL 13 — "NABIZ"
   Üstte bir hasta monitörü. Altta aynı gün tekrar tekrar döner: YATAK → MASA → KOLTUK.
   Nabız neredeyse düz: 52 BPM. Bir gün adam telefonu fırlatır, kalkar, koşar:
   EKG patlar, 148 BPM. Giriş yok: ilk karede monitör bip'liyor ve rutin dönüyor. */
(function () {
  const { lerp, clamp, E, prog } = F;
  const TB = 7.8, TU = 8.2, TA = 9.6;                  // kırılma, kalkış, tam canlılık
  const floor = 1390, DAY = 1.15;
  const alive = (t) => E.inOutCubic(prog(t, TU, TA));
  const bpm = (t) => lerp(52, 148, alive(t));
  const amp = (t) => lerp(0.22, 1, alive(t));
  const DT = 1 / 240, N = Math.ceil(21 / DT), PH = new Float32Array(N), RUN = new Float32Array(N);
  for (let i = 1; i < N; i++) { const t = i * DT; PH[i] = PH[i - 1] + bpm(t) / 60 * DT; RUN[i] = RUN[i - 1] + 12.5 * clamp((t - 8.9) / 0.6) * DT; }
  const ph = (t) => t < 0 ? t * 52 / 60 : PH[Math.min(N - 1, Math.round(t / DT))];
  const runPh = (t) => RUN[Math.max(0, Math.min(N - 1, Math.round(t / DT)))];
  const bump = (u, c, w) => Math.exp(-(((u - c) / w) ** 2));
  const ecg = (p) => { const u = ((p % 1) + 1) % 1; return 0.12 * bump(u, 0.18, 0.035) - 0.15 * bump(u, 0.3, 0.01) + bump(u, 0.32, 0.012) - 0.28 * bump(u, 0.345, 0.012) + 0.25 * bump(u, 0.55, 0.05); };
  const DAYS = ['PZT', 'SAL', 'ÇAR', 'PER', 'CUM', 'CMT', 'PAZ'];

  Reel({
    title: 'Nabız',
    duration: 20,
    cues() {
      const c = [{ t: 0, type: 'hit' }];
      let last = Math.floor(ph(0) + 0.68);
      for (let t = 0; t < 13; t += 1 / 240) { const k = Math.floor(ph(t) + 0.68); if (k !== last) { c.push({ t, type: 'beep', p: alive(t), g: lerp(0.35, 0.55, alive(t)) }); last = k; } }
      for (let t = 0; t < TB; t += DAY) c.push({ t, type: 'swipe' }, { t: t + DAY * 0.3, type: 'swipe' }, { t: t + DAY * 0.65, type: 'swipe' });
      let ls = 0;
      for (let t = 9; t < 13; t += 1 / 120) { const k = Math.floor(runPh(t) / Math.PI); if (k !== ls) { c.push({ t, type: 'step', p: 0.4 }); ls = k; } }
      c.push({ t: TB, type: 'drop' }, { t: TU, type: 'whoosh' }, { t: TU + 0.05, type: 'hit' }, { t: TU, type: 'riser', d: TA - TU }, { t: TA, type: 'climax' },
        { t: 0.6, type: 'whoosh' }, { t: 3.8, type: 'whoosh' }, { t: 10.8, type: 'whoosh' },
        { t: 13.0, type: 'drop' }, { t: 13.3, type: 'punch' }, { t: 14.5, type: 'hit' }, { t: 17.3, type: 'end' });
      return { music: { bpm: 128, grid0: TU, climax: 13.0, punch: 13.3, end: 17.3, prog: 'am', drums: 'full' }, cues: c };
    },
    draw(ctx, t, F) {
      const { W, H, CONFIG: C } = F;
      const al = alive(t);
      const col = F.mixHex('#3ee08f', '#f4b740', al);
      let gx = 0; if (t > TB && t < TU) gx = (Math.random() - 0.5) * 0;   // deterministik kalması için titreşim yok
      F.background(ctx, t, { tint: F.hexA(C.gold, 0.1 * al), tintY: 1100 });

      // ---- MONİTÖR ----
      const mx = 80, my = 250, mw = 920, mh = 400;
      F.panel(ctx, mx, my, mw, mh, { r: 26, fill: 'rgba(10,20,14,0.55)', stroke: F.hexA(col, 0.35) });
      ctx.save(); F.rrect(ctx, mx, my, mw, mh, 26); ctx.clip();
      ctx.strokeStyle = F.hexA(col, 0.07); ctx.lineWidth = 1;
      for (let x = mx; x < mx + mw; x += 40) { ctx.beginPath(); ctx.moveTo(x, my); ctx.lineTo(x, my + mh); ctx.stroke(); }
      for (let y = my; y < my + mh; y += 40) { ctx.beginPath(); ctx.moveTo(mx, y); ctx.lineTo(mx + mw, y); ctx.stroke(); }
      // iz
      const x0 = mx + 30, x1 = mx + mw - 30, cy = my + 250, span = 3.0;
      ctx.beginPath();
      for (let x = x0; x <= x1; x += 3) {
        const tau = t - (x1 - x) / (x1 - x0) * span;
        const y = cy - ecg(ph(tau)) * amp(Math.max(0, tau)) * 170;
        x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.shadowColor = col; ctx.shadowBlur = 18; ctx.stroke(); ctx.stroke();
      const hy = cy - ecg(ph(t)) * amp(t) * 170;
      ctx.fillStyle = '#fff'; ctx.shadowBlur = 24; ctx.beginPath(); ctx.arc(x1, hy, 8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // yazılar
      const beatK = Math.max(0, 1 - (((ph(t) + 0.68) % 1) / 0.25));
      F.text(ctx, 'NABIZ', mx + 34, my + 46, { size: 24, weight: 800, align: 'left', color: col, ls: 4 });
      ctx.save(); ctx.translate(mx + 160, my + 46); ctx.scale(1 + 0.25 * beatK, 1 + 0.25 * beatK);
      ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 16; ctx.beginPath();
      ctx.moveTo(0, 10); ctx.bezierCurveTo(-26, -8, -12, -26, 0, -12); ctx.bezierCurveTo(12, -26, 26, -8, 0, 10); ctx.fill(); ctx.restore();
      F.text(ctx, String(Math.round(bpm(t))), mx + mw - 120, my + 66, { size: 72, weight: 700, font: C.mono, align: 'right', color: col, glow: 18 });
      F.text(ctx, 'BPM', mx + mw - 34, my + 74, { size: 24, weight: 700, font: C.mono, align: 'right', color: F.hexA(col, 0.7) });
      const dayN = Math.floor(t / DAY);
      if (t < TU) F.text(ctx, DAYS[dayN % 7] + ' · AYNI GÜN ×' + (211 + dayN), mx + 34, my + mh - 32, { size: 22, weight: 700, font: C.mono, align: 'left', color: F.hexA(col, 0.8) });
      else F.text(ctx, 'YENİ BİR GÜN', mx + 34, my + mh - 32, { size: 22, weight: 800, font: C.mono, align: 'left', color: col, glow: 12, alpha: prog(t, TU, TU + 0.4) });

      // ---- ODA (rutin) ----
      const roomA = 1 - E.inOutQuad(prog(t, 8.4, 9.2));
      if (roomA > 0) {
        ctx.save(); ctx.globalAlpha = roomA;
        ctx.fillStyle = '#15171c'; ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 3;
        // yatak
        F.rrect(ctx, 110, floor - 80, 290, 70, 14); ctx.fill(); ctx.stroke();
        F.rrect(ctx, 110, floor - 120, 70, 40, 12); ctx.fill(); ctx.stroke();
        ctx.fillRect(120, floor - 10, 12, 10); ctx.fillRect(378, floor - 10, 12, 10);
        // masa + laptop
        F.rrect(ctx, 450, floor - 150, 230, 18, 6); ctx.fill(); ctx.stroke();
        ctx.fillRect(470, floor - 132, 12, 132); ctx.fillRect(650, floor - 132, 12, 132);
        ctx.fillStyle = '#2a2d35'; F.rrect(ctx, 590, floor - 230, 90, 70, 6); ctx.fill();
        ctx.fillStyle = F.hexA('#3d8bff', 0.6); F.rrect(ctx, 598, floor - 222, 74, 54, 4); ctx.fill();
        ctx.fillStyle = '#15171c'; F.rrect(ctx, 440, floor - 80, 70, 14, 5); ctx.fill(); ctx.stroke();   // sandalye
        ctx.fillRect(446, floor - 66, 10, 66);
        // koltuk
        F.rrect(ctx, 740, floor - 140, 250, 80, 18); ctx.fill(); ctx.stroke();
        F.rrect(ctx, 728, floor - 90, 274, 80, 16); ctx.fill(); ctx.stroke();
        ctx.restore();
        // istasyon etiketleri
        const st = ['UYU', 'ÇALIŞ', 'KAYDIR'];
        const u = (t % DAY) / DAY, cur = t >= TB ? 2 : (u < 0.3 ? 0 : u < 0.65 ? 1 : 2);
        [255, 565, 865].forEach((x, i) => F.text(ctx, st[i], x, floor + 50, { size: 22, weight: 800, ls: 4, color: i === cur ? C.red : C.dim, alpha: roomA }));
        // adam: istasyonlar arasında "ışınlanır"
        const phoneCols = ['#ff3fa4', '#3d8bff', '#3ee08f', '#ff8a3d'];
        const gray = '#a29d97';
        if (t < TU + 0.1) {
          if (cur === 0) {
            ctx.save(); ctx.globalAlpha = roomA; ctx.translate(380, floor - 92); ctx.rotate(-Math.PI / 2);
            F.stickman(ctx, { x: 0, y: 0, s: 1.05, pose: { ...F.P.stand(0), head: 0.1 }, color: gray }); ctx.restore();
          } else if (cur === 1) {
            F.stickman(ctx, { x: 485, y: floor - 80, s: 1.05, dir: 1, pose: { lean: 0.25, hipL: 1.5, kneeL: 1.4, hipR: 1.4, kneeR: 1.35, shL: 1.0, elL: 0.9, shR: 1.1, elR: 0.8, head: 0.4, sit: true }, color: gray, alpha: roomA });
          } else {
            F.stickman(ctx, { x: 830, y: floor - 92, s: 1.05, dir: 1, pose: { ...F.P.sitPhone(t), sit: true, phone: t < TU }, phoneColor: phoneCols[Math.floor(t / 0.4) % 4], color: gray, alpha: roomA });
          }
        }
        // fırlatılan telefon
        if (t >= TU && t < TU + 1.2) {
          const q = (t - TU) / 1.2;
          const px = lerp(870, 1150, q), py = floor - 200 - 600 * q + 900 * q * q;
          ctx.save(); ctx.translate(px, py); ctx.rotate(q * 12); ctx.fillStyle = '#15161a'; F.rrect(ctx, -14, -24, 28, 48, 6); ctx.fill();
          ctx.fillStyle = '#ff3fa4'; F.rrect(ctx, -10, -20, 20, 40, 4); ctx.fill(); ctx.restore();
        }
      }

      // ---- CANLI: koşu ----
      if (t >= TU) {
        const k = prog(t, TU, TU + 0.5);
        const scroll = runPh(t) / 12.5 * 600;
        ctx.save(); ctx.globalAlpha = prog(t, 8.6, 9.2);
        F.glowCircle(ctx, 1000, floor - 240, 520, C.gold, 0.7);
        ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, floor); ctx.lineTo(W, floor); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 4;
        for (let i = -1; i < 12; i++) { const x = ((i * 120 - scroll) % 1440 + 1440) % 1440 - 120; ctx.beginPath(); ctx.moveTo(x, floor + 40); ctx.lineTo(x + 60, floor + 40); ctx.stroke(); }
        ctx.restore();
        const x = lerp(830, 420, E.inOutCubic(prog(t, TU, 9.2)));
        const standP = { ...F.P.stand(t), head: -0.2 };
        let pose = F.mixPose({ ...F.P.sitPhone(t), phone: false }, standP, k);
        if (t > 8.7) pose = F.mixPose(standP, F.P.run(runPh(t) + t * 3, 1), clamp((t - 8.7) / 0.5));
        const y = lerp(floor - 92, floor, k);
        if (t > 9.2) F.embers(ctx, t, { x, y: floor - 120, w: 80, h: 220, n: 30, color: C.gold, seed: 4 });
        F.stickman(ctx, { x, y, s: 1.3, dir: 1, pose: { ...pose, sit: k < 0.5 }, color: F.mixHex('#a29d97', '#f4f2ee', al), glow: 36 * al, glowColor: C.gold });
      }

      // ---- ara yazılar ----
      const cap = (str, a, b, c2) => { const k = prog(t, a, a + 0.4) * (1 - prog(t, b - 0.4, b)); if (k > 0) F.revealLine(ctx, str, W / 2, 1540, prog(t, a, a + 0.6), { size: 38, weight: 800, alpha: k, accent: c2 }); };
      cap('UYAN. ÇALIŞ. KAYDIR. *UYU.*', 0.6, 3.6, C.red);
      cap('*217 GÜNDÜR* AYNI GÜN.', 3.8, 7.7, C.red);
      cap('BİR GÜN *YETER* DERSİN.', 8.0, 10.6, C.gold);
      cap('VE NABZIN *İLK KEZ* ATAR.', 10.8, 12.9, C.gold);

      // ---- final ----
      if (t > 13.0) {
        const k = E.outCubic(prog(t, 13.0, 13.7));
        ctx.save(); ctx.fillStyle = `rgba(5,6,8,${0.84 * k})`; ctx.fillRect(0, 0, W, H); ctx.restore();
        F.revealLine(ctx, 'NEFES ALMAK', W / 2, 870, prog(t, 13.3, 13.9), { size: 100, weight: 900 });
        F.revealLine(ctx, '*YAŞAMAK DEĞİL.*', W / 2, 1020, prog(t, 14.5, 15.1), { size: 110, weight: 900, accent: C.red, hiGlow: 46, stagger: 0.3 });
      }
      F.handleTag(ctx, 1 - prog(t, 16.7, 17.1));
      F.endCard(ctx, t, 17.3);
    },
  });
})();
</script>
</body>
</html>
